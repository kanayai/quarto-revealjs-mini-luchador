# bananarama image-generation spec for the mini-luchador theme
# Run with: bananarama::bananarama("bananarama.yaml")
# Requires OPENAI_API_KEY set in the environment (e.g. ~/.Renviron)
# Reference image: [mascot] resolves to mascot.png in this same directory.

output-dir: assets

defaults:
  model: gpt-image-2.5-sunburst
  aspect-ratio: "16:9"
  style: >
    Flat vector sticker illustration, bold black outline, cel-shaded with
    simple highlights, chibi proportions. Mini luchador mascot: teal and
    gold wrestling mask with a lightning-bolt motif, red cape, red trunks
    with gold accents, warm skin tone, joyful dynamic pose. Cream/white
    background. Data-science motifs woven in subtly (scatter dots, a trend
    line, simple axes) without overwhelming the composition. Leave a large
    clear empty area as described per image, for slide text to sit on top.

images:
  - name: title1
    description: >
      [mascot] centred, mid-leap pose, small scattered data dots and a
      wavy trend line framing the top and bottom edges. Wide open empty
      space in the vertical centre for a title.
  - name: title2
    description: >
      [mascot] positioned bottom-left corner, cape flowing. Empty space
      across the right two-thirds for centred title text.
  - name: title3
    description: >
      [mascot] positioned top-right corner, pointing outward. Empty
      space across the lower two-thirds for centred title text.
  - name: title4
    description: >
      [mascot] small, positioned bottom-centre. Empty space across the
      upper two-thirds for centred title text.
  - name: section1
    description: >
      [mascot] large, filling the left third of the frame. Empty cream
      space on the right two-thirds for left-aligned section text.
  - name: section2
    description: >
      [mascot] large, filling the right third of the frame. Empty cream
      space on the left two-thirds for section text.
  - name: section3
    description: >
      [mascot] small, tucked in the bottom-left corner. Empty space
      dominating the rest of the frame for section text starting near
      the left margin.
  - name: section4
    description: >
      [mascot] mid-size, positioned bottom-right, leaping. Empty space
      across the top and left for section text.
  - name: slide1
    description: >
      Small [mascot] tucked in the bottom-right corner only, rest of the
      frame plain cream with a faint data-dot texture. Full frame free
      for body content.
  - name: slide2
    description: >
      Small [mascot] peeking from the left edge, mid-height. Rest of the
      frame plain cream, free for body content starting after the left
      margin.
  - name: slide3
    description: >
      Small [mascot] tucked in the top-left corner. Rest of the frame
      plain cream, free for body content starting after the left
      margin.
  - name: slide4
    description: >
      Small [mascot] centred along the very top edge only. Rest of the
      frame plain cream, free for body content below.
